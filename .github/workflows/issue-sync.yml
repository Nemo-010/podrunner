name: issue-sync

# The issues of podrunner against its record (T-264, the ruling "Issues"
# of the owner): the workflow of podcrates writes the status block of each
# issue from the record, closes an issue that the record closes, and fails
# on drift that it cannot fix. It is a dry run until a session read the
# output of one: then set the default of `dry_run` to false.

on:
  push:
    branches: [main]
    paths:
      - TODO/**
  schedule:
    # Each day at 06:23 UTC, off the hour.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print each change and change nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  issues:
    permissions:
      contents: read
      issues: write
    uses: PodUtils/podcrates/.github/workflows/issue-sync.yml@d85f2d245b9de93b6932124c06463c7f6416203e # v0.69.0
    with:
      podcrates_ref: v0.69.0
      # A push and the schedule print only, until the first output is read.
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
